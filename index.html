<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">DJ Astro — DC/MD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0A; --bg-2: #050505; --ink: #F2F0EC; --ink-soft: #A8A4A0;
    --line: #1E1C1C; --magenta: #FF2A9D; --cyan: #4CE0E8;
    /* Adjust this to reframe the hero photo's crop.
       First value = horizontal (0%=left edge, 50%=center, 100%=right edge)
       Second value = vertical (0%=top edge, 50%=center, 100%=bottom edge) */
    --hero-photo-position:100% 40%;
    --hero-height: clamp(520px, 90vh, 800px);
    --hero-photo-width: minmax(600px, 800px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }
  a { color: inherit; }
  .neon-text { background: linear-gradient(90deg, var(--magenta), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .topbar { position: sticky; top: 0; z-index: 50; background: rgba(10,10,10,0.85); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1400px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.02em; text-decoration: none; }
  .nav-links { display: flex; gap: 24px; }
  .nav-links a { text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; color: var(--ink-soft); }
  .nav-links a:hover { color: var(--ink); }

  .hero { position: relative; height: var(--hero-height); overflow: hidden; background: linear-gradient(160deg, #14061F 0%, #0A0A0A 70%); }
  .hero-inner { position: relative; max-width: 1200px; margin: 0 auto; height: 100%; display: grid; grid-template-columns: 1fr var(--hero-photo-width); }
  .scroll-cue { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 4; opacity: 0.7; animation: scroll-bounce 2s ease-in-out infinite; transition: opacity 0.3s ease; }
  .scroll-cue svg { width: 22px; height: 22px; stroke: var(--ink); }
  @keyframes scroll-bounce { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(7px); } }
  .hero-text { padding: 64px 40px; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 3; }
  .grid-floor { position: absolute; bottom: -15%; left: -15%; width: 100%; height: 65%; background-image: linear-gradient(rgba(255,42,157,0.22) 1px, transparent 1px), linear-gradient(90deg, rgba(255,42,157,0.22) 1px, transparent 1px); background-size: 36px 22px; transform: perspective(220px) rotateX(55deg); transform-origin: bottom left; z-index: 1; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; color: var(--magenta); margin-bottom: 18px; position: relative; z-index: 2; }
  .hero-text h1 { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(44px, 7vw, 68px); line-height: 0.92; margin-bottom: 20px; position: relative; z-index: 2; text-shadow: 0 0 40px rgba(255,42,157,0.28); }
  .hero-sub { font-size: 15px; color: var(--ink-soft); max-width: 380px; margin-bottom: 26px; position: relative; z-index: 2; }
  .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; position: relative; z-index: 2; }
  .btn { display: inline-flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 12px 22px; border-radius: 4px; text-decoration: none; }
  .btn-primary { background: linear-gradient(90deg, var(--magenta), var(--cyan)); color: #0A0A0A; font-weight: 500; }
  .btn-secondary { border: 1px solid #3a3838; color: var(--ink); }
  .btn-secondary:hover { border-color: var(--cyan); color: var(--cyan); }

  .hero-photo { position: relative; overflow: hidden; }
  .hero-photo img { width: 100%; height: 100%; object-fit: cover; object-position: var(--hero-photo-position); display: block; filter: contrast(1.04) brightness(0.98); }
  .photo-tint { position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,42,157,0.4), rgba(76,224,232,0.22)); mix-blend-mode: color; pointer-events: none; }
  .photo-fade { position: absolute; inset: 0; background: linear-gradient(90deg, #14061F 0%, rgba(20,6,31,0) 42%); }

  .genres { padding: 44px 0; background: var(--bg-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .genre-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .genre-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.05em; padding: 7px 16px; border-radius: 20px; border: 1px solid #2a2828; color: var(--ink-soft); }

  section.block { padding: 64px 0; }
  .kicker { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: var(--ink-soft); margin-bottom: 18px; }

  .overview-grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 52px; }
  .overview-left { display: flex; flex-direction: column; gap: 48px; justify-content: center; }
  .overview-right { display: flex; flex-direction: column; }

  .bio-text { font-size: 17px; max-width: 460px; line-height: 1.7; color: #d8d5d1; }

  .dates-list { display: flex; flex-direction: column; }
  .date-row { display: grid; grid-template-columns: 100px 1fr auto; align-items: center; gap: 16px; padding: 18px 0; border-top: 1px solid var(--line); }
  .date-row:first-child { border-top: none; }
  .date-num { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-soft); }
  .date-venue { font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 15px; }
  .date-city { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .date-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--cyan); border: 1px solid #23504f; padding: 5px 11px; border-radius: 20px; white-space: nowrap; }
  .dates-empty { font-size: 14px; color: var(--ink-soft); font-style: italic; padding: 20px 0; }

  .gallery-slideshow { position: relative; flex: 1; min-height: 260px; border-radius: 8px; overflow: hidden; background: var(--bg-2); margin-top: 8px; }
  .gallery-slideshow img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 1.1s ease; filter: saturate(0.85) contrast(1.05); }
  .gallery-slideshow img.active { opacity: 1; }
  .slideshow-caption {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 28px 16px 12px; background: linear-gradient(0deg, rgba(0,0,0,0.75), transparent);
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft);
  }
  .slideshow-dots { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .slideshow-dots .dot { width: 6px; height: 6px; border-radius: 50%; background: #3a3838; border: none; padding: 0; cursor: pointer; }
  .slideshow-dots .dot.active { background: var(--cyan); }
  .gallery-cta { display: inline-block; margin-top: 18px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--cyan); text-decoration: none; }
  .gallery-cta:hover { text-decoration: underline; }

  .reviews-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .reviews-viewall { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--cyan); text-decoration: none; white-space: nowrap; padding-bottom: 6px; }
  .reviews-viewall:hover { text-decoration: underline; }

  .marquee { overflow-x: auto; overflow-y: hidden; margin-top: 20px; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
  .marquee::-webkit-scrollbar { display: none; }
  .marquee-track { display: flex; gap: 16px; width: max-content; }
  .review-card { flex: 0 0 320px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 22px; }
  .review-card .quote { font-size: 14px; color: #d8d5d1; line-height: 1.6; margin-bottom: 16px; }
  .review-card .quote::before { content: '“'; color: var(--cyan); }
  .review-card .quote::after { content: '”'; color: var(--cyan); }
  .review-name { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 500; }
  .review-role { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .contact-heading { font-family: 'Unbounded', sans-serif; font-size: 26px; font-weight: 700; max-width: 340px; line-height: 1.2; }
  .contact-links { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
  .contact-links a { text-decoration: none; display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: var(--ink-soft); }
  .contact-links svg { width: 1.05em; height: 1.05em; flex-shrink: 0; }
  .contact-links a:hover { color: var(--cyan); }
  .form-note { font-size: 12px; color: var(--ink-soft); margin-top: 10px; }
  .gform-card { background: #fff; border-radius: 8px; overflow: hidden; max-height: 500px; overflow-y: auto; }
  .gform-card iframe { display: block; }

  footer { padding: 40px 0 60px; border-top: 1px solid var(--line); text-align: center; }
  footer p { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); }

  @media (max-width: 760px) {
    .hero { height: auto; }
    .hero-inner { grid-template-columns: 1fr; }
    .hero-photo { height: 320px; order: -1; }
    .hero-text { padding: 40px 24px; }
    .contact-grid { grid-template-columns: 1fr; }
    .date-row { grid-template-columns: 60px 1fr; }
    .date-tag { grid-column: 2; justify-self: start; margin-top: 6px; }
    .overview-grid { grid-template-columns: 1fr; gap: 44px; }
    .gallery-slideshow { aspect-ratio: 4/3; min-height: 0; }
  }
</style>
</head>

<script>
  const $ = (id) => document.getElementById(id);

  document.title = CONTENT.pageTitle;
  $('brand').textContent = CONTENT.brand;
  $('nav-links').innerHTML = `
    <a href="#dates">${CONTENT.nav.dates}</a>
    <a href="gallery/index.html">${CONTENT.nav.gallery}</a>
    <a href="reviews/index.html">${CONTENT.nav.reviews}</a>
    <a href="#contact">${CONTENT.nav.contact}</a>
  `;

  $('hero-eyebrow').textContent = CONTENT.hero.eyebrow;
  $('hero-headline').textContent = CONTENT.hero.headline;
  $('hero-sub').textContent = CONTENT.hero.sub;
  $('hero-actions').innerHTML = `
    <a class="btn btn-primary" href="#contact">${CONTENT.hero.bookBtnLabel}</a>
    <a class="btn btn-secondary" href="gallery/index.html">${CONTENT.hero.galleryBtnLabel}</a>
  `;
  $('hero-photo-img').src = CONTENT.hero.photo;

  $('genre-row').innerHTML = CONTENT.genres.map(g => `<span class="genre-tag">${g}</span>`).join('');

  $('bio-kicker').textContent = CONTENT.bio.kicker;
  $('bio-text').textContent = CONTENT.bio.text;

  $('dates-kicker').textContent = CONTENT.dates.kicker;
  const dl = $('dates-list');
  if (CONTENT.dates.list.length === 0) {
    dl.innerHTML = `<p class="dates-empty">${CONTENT.dates.emptyMessage}</p>`;
  } else {
    dl.innerHTML = CONTENT.dates.list.map(d => `
      <div class="date-row">
        <div class="date-num">${d.date}</div>
        <div><div class="date-venue">${d.venue}</div><div class="date-city">${d.city}</div></div>
        <div class="date-tag">${d.tag}</div>
      </div>
    `).join('');
  }

  $('gallery-kicker').textContent = CONTENT.galleryTeaser.kicker;
  $('gallery-cta').textContent = CONTENT.galleryTeaser.viewGalleryLabel;

  const slides = CONTENT.galleryTeaser.photos;
  const slideshowEl = $('gallery-slideshow');
  const dotsEl = $('slideshow-dots');
  slideshowEl.innerHTML = slides.map((p, i) => `<img src="${p.src}" alt="${p.caption || ''}" class="${i === 0 ? 'active' : ''}">`).join('')
    + `<div class="slideshow-caption" id="slideshow-caption">${slides[0] && slides[0].caption ? slides[0].caption : ''}</div>`;
  if (slides.length > 1) {
    dotsEl.innerHTML = slides.map((_, i) => `<button class="dot${i === 0 ? ' active' : ''}" data-i="${i}" aria-label="Show photo ${i + 1}"></button>`).join('');
  }
  let current = 0;
  const imgEls = slideshowEl.querySelectorAll('img');
  const dotEls = dotsEl.querySelectorAll('.dot');
  const captionEl = $('slideshow-caption');
  function showSlide(i) {
    current = i;
    imgEls.forEach((el, idx) => el.classList.toggle('active', idx === i));
    dotEls.forEach((el, idx) => el.classList.toggle('active', idx === i));
    if (captionEl) captionEl.textContent = slides[i].caption || '';
  }
  dotEls.forEach(el => el.addEventListener('click', () => showSlide(Number(el.dataset.i))));
  if (slides.length > 1) {
    setInterval(() => showSlide((current + 1) % slides.length), 4500);
  }

  $('reviews-kicker').textContent = CONTENT.testimonials.kicker;
  $('reviews-heading').textContent = CONTENT.testimonials.heading;
  $('reviews-viewall').textContent = CONTENT.testimonials.viewAllLabel;
  const reviewCard = (r) => `
    <div class="review-card">
      <div class="quote">${r.quote}</div>
      <div class="review-name">${r.name}</div>
      <div class="review-role">${r.role}</div>
    </div>
  `;
  // Duplicate the list so the scroll loop has no visible seam.
  const doubledReviews = [...CONTENT.testimonials.list, ...CONTENT.testimonials.list];
  $('marquee-track').innerHTML = doubledReviews.map(reviewCard).join('');

  const marqueeEl = $('marquee-wrap');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let autoScroll = !reducedMotion;
  function tickMarquee() {
    if (autoScroll && marqueeEl) {
      marqueeEl.scrollLeft += 0.5;
      const half = marqueeEl.scrollWidth / 2;
      if (marqueeEl.scrollLeft >= half) marqueeEl.scrollLeft -= half;
    }
    requestAnimationFrame(tickMarquee);
  }
  requestAnimationFrame(tickMarquee);
  ['touchstart', 'mousedown'].forEach(evt => marqueeEl.addEventListener(evt, () => { autoScroll = false; }));
  ['touchend', 'mouseup'].forEach(evt => marqueeEl.addEventListener(evt, () => { setTimeout(() => { autoScroll = !reducedMotion; }, 1500); }));
  marqueeEl.addEventListener('mouseenter', () => { autoScroll = false; });
  marqueeEl.addEventListener('mouseleave', () => { autoScroll = !reducedMotion; });

  $('contact-kicker').textContent = CONTENT.contact.kicker;
  $('contact-heading').textContent = CONTENT.contact.heading;
  $('contact-links').innerHTML = `
