<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Gallery — DJ Astro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0A; --bg-2: #050505; --ink: #F2F0EC; --ink-soft: #A8A4A0;
    --line: #1E1C1C; --magenta: #FF2A9D; --cyan: #4CE0E8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  .container { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  a { color: inherit; }

  .topbar { position: sticky; top: 0; z-index: 50; background: rgba(10,10,10,0.85); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1080px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
  .nav-links { display: flex; gap: 24px; }
  .nav-links a { text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; color: var(--ink-soft); }
  .nav-links a:hover { color: var(--ink); }

  .header { padding: 56px 0 36px; }
  .kicker { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: var(--magenta); margin-bottom: 14px; }
  h1 { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(30px, 5vw, 44px); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-bottom: 72px; }
  .tile { position: relative; aspect-ratio: 4/5; border-radius: 8px; overflow: hidden; cursor: pointer; background: var(--bg-2); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(0.9) contrast(1.05); transition: transform 0.3s ease; }
  .tile:hover img { transform: scale(1.05); }
  .tile .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px; background: linear-gradient(0deg, rgba(0,0,0,0.75), transparent); font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }

  .tile.empty { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; border: 1px dashed #2a2828; cursor: default; }
  .tile.empty .plus { font-size: 26px; color: #3a3838; font-family: 'IBM Plex Mono', monospace; }
  .tile.empty span.label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #55524f; text-align: center; padding: 0 12px; }

  .lightbox { position: fixed; inset: 0; background: rgba(5,5,5,0.94); z-index: 100; display: none; align-items: center; justify-content: center; padding: 40px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 82vh; object-fit: contain; border-radius: 6px; }
  .lightbox-close { position: absolute; top: 24px; right: 28px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--ink-soft); background: none; border: 1px solid #2a2828; border-radius: 20px; padding: 8px 16px; cursor: pointer; }
  .lightbox-close:hover { color: var(--ink); border-color: var(--cyan); }
  .lightbox-cap { position: absolute; bottom: 28px; left: 0; right: 0; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); }

  @media (max-width: 760px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<!--
  ============================================================
  EDIT EVERYTHING HERE.

  TO ADD A PHOTO AFTER DEPLOYMENT:
  1. Drop your image file into the /assets folder (next to astro-hero.jpg).
  2. Add one line to the photos list below:
     { src: "../assets/yourfile.jpg", caption: "Optional caption" }
  3. Save and re-upload — no other code needs to change.

  Empty tiles are just placeholders so you can see the grid fill out.
  Lower emptySlots as you add real photos, or set it to 0 to remove them.
  ============================================================
-->
<script>
  const CONTENT = {
    pageTitle: "Gallery — DJ Astro",
    brand: "DJ ASTRO",
    nav: { home: "Home", dates: "Dates", reviews: "Reviews", contact: "Contact" },
    kicker: "GALLERY",
    heading: "From the booth",
    emptySlots: 5,
    photos: [
      { src: "../assets/astro-hero.jpg", caption: "Studio portrait" }
    ]
  };
</script>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="brand"></div>
    <nav class="nav-links" id="nav-links"></nav>
  </div>
</div>

<div class="container">
  <div class="header">
    <div class="kicker" id="kicker"></div>
    <h1 id="heading"></h1>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">Close ✕</button>
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-cap" id="lightbox-cap"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  document.title = CONTENT.pageTitle;
  $('brand').textContent = CONTENT.brand;
  $('nav-links').innerHTML = `
    <a href="../index.html">${CONTENT.nav.home}</a>
    <a href="../index.html#dates">${CONTENT.nav.dates}</a>
    <a href="../reviews/index.html">${CONTENT.nav.reviews}</a>
    <a href="../index.html#contact">${CONTENT.nav.contact}</a>
  `;
  $('kicker').textContent = CONTENT.kicker;
  $('heading').textContent = CONTENT.heading;

  const grid = $('grid');
  const lightbox = $('lightbox');
  const lightboxImg = $('lightbox-img');
  const lightboxCap = $('lightbox-cap');

  CONTENT.photos.forEach(p => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = `<img src="${p.src}" alt="${p.caption || ''}" loading="lazy">${p.caption ? `<div class="cap">${p.caption}</div>` : ''}`;
    tile.addEventListener('click', () => {
      lightboxImg.src = p.src;
      lightboxCap.textContent = p.caption || '';
      lightbox.classList.add('open');
    });
    grid.appendChild(tile);
  });

  for (let i = 0; i < CONTENT.emptySlots; i++) {
    const tile = document.createElement('div');
    tile.className = 'tile empty';
    tile.innerHTML = `<div class="plus">+</div><span class="label">add a photo</span>`;
    grid.appendChild(tile);
  }

  $('lightbox-close').addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.classList.remove('open'); });
</script>

</body>
</html>
